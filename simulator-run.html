<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр | Системный анализ с нуля</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/icons.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Системный анализ с нуля</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="dashboard.html" class="nav-link">Уроки</a>
                <a href="simulator.html" class="nav-link">Тренажёр</a>
                <a href="profile.html" class="nav-link active">Профиль</a>
                <a href="#" class="nav-link" id="logoutLink">Выход</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section style="padding: 3rem 0;">
            <div class="container">
                <!-- Progress Bar -->
                <div style="margin-bottom: 2rem;">
                    <div style="height: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; margin-bottom: 0.5rem;">
                        <div class="progress-fill" id="progressFill" style="height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); width: 0%; transition: width 0.5s ease;"></div>
                    </div>
                    <div class="progress-text" id="progressText" style="text-align: center; color: var(--text-secondary);">Этап 1 из 5</div>
                </div>

                <!-- Simulator Content Area -->
                <div class="glass-card" style="padding: 2rem;">
                    <div id="simulatorContent">
                        <!-- Content will be loaded dynamically -->
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div style="display: flex; justify-content: space-between; margin-top: 2rem; flex-wrap: wrap; gap: 1rem;">
                    <button class="btn btn-secondary" id="prevBtn">Назад</button>
                    <button class="btn btn-primary" id="nextBtn">Далее</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Курс "Системный анализ с нуля". Все права защищены.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        // Global variables
        let currentSimulator = null;
        let currentStageIndex = 0;
        let stageHistory = [];

        // Typewriter effect function
        function typeWriter(element, text, speed = 25) {
            element.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // DOM Ready
        document.addEventListener('DOMContentLoaded', function() {
            // Check authorization first
            apiGetMe().then(user => {
                if (user === null) {
                    window.location.href = 'login.html';
                    return;
                }

                // Get simulator ID from URL
                const urlParams = new URLSearchParams(window.location.search);
                const simulatorId = parseInt(urlParams.get('id'));

                if (simulatorId) {
                    // Load simulator content
                    loadSimulator(simulatorId);
                }

                // Setup navigation buttons
                document.getElementById('prevBtn').addEventListener('click', goToPreviousStage);
                document.getElementById('nextBtn').addEventListener('click', goToNextStage);
            });
        });

        // Load simulator data
        function loadSimulator(simulatorId) {
            fetch('simulators.json')
                .then(response => response.json())
                .then(data => {
                    const simulator = data.simulators.find(s => s.id === simulatorId);
                    if (simulator) {
                        currentSimulator = simulator;
                        renderStage();
                    } else {
                        document.getElementById('simulatorContent').innerHTML = '<p>Ошибка: Тренажёр не найден.</p>';
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки тренажёра:', error);
                    document.getElementById('simulatorContent').innerHTML = '<p>Ошибка загрузки тренажёра. Попробуйте обновить страницу.</p>';
                });
        }

        // Render current stage
        function renderStage() {
            if (!currentSimulator || currentStageIndex < 0 || currentStageIndex >= currentSimulator.stages.length) {
                return;
            }

            const stage = currentSimulator.stages[currentStageIndex];
            const contentElement = document.getElementById('simulatorContent');

            // Update progress bar
            updateProgress();

            // Replace {userName} with actual user name
            const userName = getUserName();

            // Render based on stage type
            switch(stage.type) {
                case 'dialogue':
                    renderDialogueStage(stage, userName);
                    break;
                case 'input':
                    renderInputStage(stage, userName);
                    break;
                case 'summary':
                    renderSummaryStage(stage, userName);
                    break;
                default:
                    contentElement.innerHTML = '<p>Неизвестный тип этапа.</p>';
            }

            // Update navigation buttons
            updateNavigationButtons();
        }

        // Render dialogue stage
        function renderDialogueStage(stage, userName) {
            let message = stage.message.replace('{userName}', userName);

            let html = `
                <div style="text-align: center; padding: 2rem 0;">
                    <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3); margin: 0 auto 1.5rem auto;">
                        ${stage.avatar}
                    </div>
                    <div style="font-size: 1.4rem; font-weight: 600; color: var(--accent-blue); margin-bottom: 1rem;">${stage.speaker}</div>
                    <div style="font-size: 1.2rem; line-height: 1.6; color: var(--text-primary); background: rgba(5, 8, 20, 0.5); padding: 1.5rem; border-radius: var(--radius); margin-bottom: 2rem; text-align: left; min-height: 100px;" id="simulatorMessage">${message}</div>
            `;

            // Add choices if they exist
            if (stage.choices && stage.choices.length > 0) {
                html += '<div style="display: flex; flex-direction: column; gap: 1rem; max-width: 600px; margin: 0 auto;">';
                stage.choices.forEach((choice, index) => {
                    html += `<button class="btn btn-secondary" data-choice-index="${index}" style="text-align: left; padding: 1.2rem; border-radius: 16px; width: 100%;">${choice.text}</button>`;
                });
                html += '</div>';

                // Add feedback container (hidden by default)
                html += '<div class="simulator-feedback" id="feedbackContainer" style="display: none; padding: 1.2rem; border-radius: 16px; margin: 1.5rem auto; max-width: 600px; text-align: center;"></div>';
            } else {
                // Add next button if no choices
                html += '<button class="btn btn-primary" id="dialogueNextBtn" style="margin: 2rem auto 0; display: block;">Далее</button>';
            }

            html += '</div>';

            document.getElementById('simulatorContent').innerHTML = html;

            // Apply typewriter effect for dialogue messages
            if (stage.type === 'dialogue') {
                const messageElement = document.getElementById('simulatorMessage');
                if (messageElement) {
                    // Clear the message element for typewriter effect
                    messageElement.textContent = '';

                    // Start typewriter effect after a small delay
                    setTimeout(() => {
                        typeWriter(messageElement, message);
                    }, 300);
                }
            }

            // Add event listeners
            if (stage.choices && stage.choices.length > 0) {
                document.querySelectorAll('[data-choice-index]').forEach(button => {
                    button.addEventListener('click', handleChoiceClick);
                });
            } else {
                document.getElementById('dialogueNextBtn').addEventListener('click', () => {
                    navigateToStage(stage.next);
                });
            }
        }

        // Handle choice click
        function handleChoiceClick(event) {
            const choiceIndex = parseInt(event.target.dataset.choiceIndex);
            const stage = currentSimulator.stages[currentStageIndex];
            const choice = stage.choices[choiceIndex];

            // Show feedback
            const feedbackContainer = document.getElementById('feedbackContainer');
            feedbackContainer.style.display = 'block';
            feedbackContainer.className = 'simulator-feedback ' + (choice.isCorrect ? 'correct' : 'incorrect');
            feedbackContainer.innerHTML = choice.feedback;
            feedbackContainer.style.background = choice.isCorrect ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
            feedbackContainer.style.border = `1px solid ${choice.isCorrect ? 'var(--success)' : 'var(--danger)'}`;
            feedbackContainer.style.color = choice.isCorrect ? 'var(--success)' : 'var(--danger)';

            // Disable all choice buttons
            document.querySelectorAll('[data-choice-index]').forEach(button => {
                button.disabled = true;
            });

            // Navigate to next stage after delay
            setTimeout(() => {
                navigateToStage(choice.next);
            }, 2000);
        }

        // Render input stage
        function renderInputStage(stage, userName) {
            let html = `
                <div style="text-align: center;">
                    <h3 style="margin-bottom: 1.5rem; color: white;">${stage.question}</h3>
                    <textarea
                        id="requirementInput"
                        placeholder="${stage.placeholder}"
                        style="width: 100%; max-width: 600px; padding: 1.2rem; border-radius: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; font-family: 'Manrope', sans-serif; font-size: 1rem; margin-bottom: 1rem;"
                        rows="4"></textarea>
                    <div style="margin-bottom: 1.5rem;">
                        <small style="color: var(--text-secondary); display: block; margin-top: 0.5rem;">${stage.hint}</small>
                    </div>
                    <button class="btn btn-primary" id="checkRequirementBtn">Проверить</button>
                    <div class="simulator-feedback" id="inputFeedback" style="display: none; padding: 1.2rem; border-radius: 16px; margin: 1.5rem auto; max-width: 600px; text-align: center;"></div>
                    <div id="nextButtonContainer" style="display: none; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="inputNextBtn">Далее</button>
                    </div>
                </div>
            `;

            document.getElementById('simulatorContent').innerHTML = html;

            // Add event listeners
            document.getElementById('checkRequirementBtn').addEventListener('click', () => {
                validateInput(stage);
            });

            document.getElementById('inputNextBtn').addEventListener('click', () => {
                navigateToStage(stage.next);
            });
        }

        // Validate input
        function validateInput(stage) {
            const input = document.getElementById('requirementInput').value.trim();
            const feedbackContainer = document.getElementById('inputFeedback');
            const nextButtonContainer = document.getElementById('nextButtonContainer');

            // Check minimum length
            if (input.length < stage.validation.minLength) {
                feedbackContainer.className = 'simulator-feedback incorrect';
                feedbackContainer.innerHTML = `Попробуй ещё! Ответ должен содержать минимум ${stage.validation.minLength} символов.`;
                feedbackContainer.style.display = 'block';
                feedbackContainer.style.background = 'rgba(239, 68, 68, 0.1)';
                feedbackContainer.style.border = '1px solid var(--danger)';
                feedbackContainer.style.color = 'var(--danger)';
                nextButtonContainer.style.display = 'none';
                return;
            }

            // Check keywords
            let keywordCount = 0;
            stage.validation.keywords.forEach(keyword => {
                if (input.toLowerCase().includes(keyword.toLowerCase())) {
                    keywordCount++;
                }
            });

            if (keywordCount < stage.validation.minKeywords) {
                feedbackContainer.className = 'simulator-feedback incorrect';
                feedbackContainer.innerHTML = `Попробуй ещё! Попробуй использовать больше ключевых слов: ${stage.validation.keywords.join(', ')}.`;
                feedbackContainer.style.display = 'block';
                feedbackContainer.style.background = 'rgba(239, 68, 68, 0.1)';
                feedbackContainer.style.border = '1px solid var(--danger)';
                feedbackContainer.style.color = 'var(--danger)';
                nextButtonContainer.style.display = 'none';
                return;
            }

            // Valid input
            feedbackContainer.className = 'simulator-feedback correct';
            feedbackContainer.innerHTML = `
                <p>Решение засчитано!</p>
                <p><strong>Пример правильного ответа:</strong></p>
                <p>${stage.correctExample}</p>
            `;
            feedbackContainer.style.display = 'block';
            feedbackContainer.style.background = 'rgba(16, 185, 129, 0.1)';
            feedbackContainer.style.border = '1px solid var(--success)';
            feedbackContainer.style.color = 'var(--success)';
            nextButtonContainer.style.display = 'block';
        }

        // Render summary stage
        function renderSummaryStage(stage, userName) {
            let message = stage.message.replace('{userName}', userName);

            let html = `
                <div style="text-align: center;">
                    <h2 style="color: var(--accent-blue); margin-bottom: 1.5rem;">Поздравляем!</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 2rem;">${message}</p>
                    <h3 style="color: white; margin: 2rem 0 1rem;">Что вы изучили:</h3>
                    <ul style="text-align: left; max-width: 600px; margin: 0 auto 2rem; padding-left: 1.5rem; color: var(--text-primary);">
            `;

            stage.learned.forEach(item => {
                html += `<li style="margin-bottom: 0.8rem;">${item}</li>`;
            });

            html += `
                    </ul>
                    <button class="btn btn-primary" id="returnToSimulatorsBtn">Вернуться к тренажёрам</button>
                </div>
            `;

            document.getElementById('simulatorContent').innerHTML = html;

            // Add event listener
            document.getElementById('returnToSimulatorsBtn').addEventListener('click', () => {
                window.location.href = 'simulator.html';
            });
        }

        // Navigate to a specific stage by ID
        function navigateToStage(stageId) {
            if (!stageId) return;

            const stageIndex = currentSimulator.stages.findIndex(s => s.id === stageId);
            if (stageIndex !== -1) {
                // Save current stage to history
                stageHistory.push(currentStageIndex);
                currentStageIndex = stageIndex;
                renderStage();
            }
        }

        // Go to previous stage
        function goToPreviousStage() {
            if (stageHistory.length > 0) {
                currentStageIndex = stageHistory.pop();
                renderStage();
            }
        }

        // Go to next stage
        function goToNextStage() {
            if (currentStageIndex < currentSimulator.stages.length - 1) {
                // Save current stage to history
                stageHistory.push(currentStageIndex);
                currentStageIndex++;
                renderStage();
            }
        }

        // Update progress bar
        function updateProgress() {
            const progressPercent = ((currentStageIndex + 1) / currentSimulator.stages.length) * 100;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            document.getElementById('progressText').textContent = `Этап ${currentStageIndex + 1} из ${currentSimulator.stages.length}`;
        }

        // Update navigation buttons
        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // Previous button
            if (stageHistory.length > 0) {
                prevBtn.disabled = false;
            } else {
                prevBtn.disabled = true;
            }

            // Next button - disable on summary stage
            if (currentSimulator.stages[currentStageIndex].type === 'summary') {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }
        }

        // Get user name from localStorage
        function getUserName() {
            try {
                const userData = JSON.parse(localStorage.getItem('user'));
                return userData && userData.name ? userData.name : 'Аналитик';
            } catch (e) {
                return 'Аналитик';
            }
        }

        // Logout functionality
        document.getElementById('logoutLink').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
