<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Системный анализ с нуля</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Системный анализ с нуля</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="login.html" class="nav-link">Вход</a>
                <a href="register.html" class="nav-link active">Регистрация</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="auth-section">
            <div class="container">
                <div class="auth-form-container">
                    <h2>Регистрация</h2>
                    <form id="registerForm" class="auth-form">
                        <div class="form-group">
                            <label for="name">Имя:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль:</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Подтвердите пароль:</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary full-width">Зарегистрироваться</button>
                        <p class="form-footer">
                            Уже есть аккаунт? <a href="login.html">Войдите</a>
                        </p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Курс "Системный анализ с нуля". Все права защищены.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
