<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр | Системный анализ с нуля</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/icons.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Системный анализ с нуля</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="dashboard.html" class="nav-link">Уроки</a>
                <a href="simulator.html" class="nav-link active">Тренажёр</a>
                <a href="profile.html" class="nav-link">Профиль</a>
                <a href="#" class="nav-link" id="logoutLink">Выход</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section style="padding: 3rem 0;">
            <div class="container">
                <h2 class="section-title">Тренажёр системного аналитика</h2>
                <div style="text-align: center; margin-bottom: 3rem; padding: 2rem; background: rgba(255, 255, 255, 0.03); border-radius: var(--radius); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08);">
                    <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Пройди реальный проект от постановки задачи до документирования</p>
                    <p style="color: var(--text-secondary);">Практикуйтесь на реальных бизнес-кейсах</p>
                </div>

                <div style="margin-bottom: 2rem;">
                    <h3 class="section-title" style="font-size: 2rem;">Доступные тренажёры</h3>
                </div>

                <div id="simulatorsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem;">
                    <!-- Simulators will be loaded dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Курс "Системный анализ с нуля". Все права защищены.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        // Load simulators dynamically
        document.addEventListener('DOMContentLoaded', function() {
            apiGetMe().then(user => {
                if (user === null) {
                    window.location.href = 'login.html';
                    return;
                }
                loadSimulators();
            });
        });

        function loadSimulators() {
            fetch('simulators.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('simulatorsContainer');
                    container.innerHTML = '';

                    data.simulators.forEach(simulator => {
                        const simulatorCard = `
                            <div class="glass-card">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                                    <div>
                                        <h3 style="font-size: 1.4rem; margin-bottom: 0.5rem;">${simulator.title}</h3>
                                        <p style="color: var(--text-secondary); margin-bottom: 1rem;"><strong>Компания:</strong> ${simulator.company}</p>
                                        <p style="color: var(--text-secondary); margin-bottom: 1rem;"><strong>Роль:</strong> ${simulator.role}</p>
                                        <p style="color: var(--text-secondary);">${simulator.description}</p>
                                    </div>
                                </div>
                                <button class="btn btn-primary" onclick="startSimulator(${simulator.id})" style="width: 100%;">Начать</button>
                            </div>
                        `;
                        container.innerHTML += simulatorCard;
                    });
                })
                .catch(error => {
                    console.error('Ошибка загрузки тренажёров:', error);
                    document.getElementById('simulatorsContainer').innerHTML = '<p>Ошибка загрузки тренажёров. Попробуйте обновить страницу.</p>';
                });
        }

        function startSimulator(id) {
            window.location.href = `simulator-run.html?id=${id}`;
        }

        // Logout functionality
        document.getElementById('logoutLink').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
