<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор пути — Системный анализ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/icons.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Системный анализ с нуля</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="dashboard.html" class="nav-link">Курс</a>
                <a href="simulator.html" class="nav-link">Тренажёр</a>
                <a href="profile.html" class="nav-link">Профиль</a>
                <a href="#" class="nav-link" id="logoutLink">Выход</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section style="padding: 3rem 0;">
            <div class="container">
                <h2 class="section-title">Куда хочешь пойти?</h2>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; margin-top: 2rem;">
                    <!-- Course Card -->
                    <a href="dashboard.html" class="glass-card" style="text-decoration: none; display: block; transition: var(--transition);">
                        <div style="text-align: center;">
                            <div class="icon icon--course icon-large" style="margin: 0 auto 1.5rem;"></div>
                            <h3 style="font-size: 1.8rem; margin-bottom: 1.5rem; color: white;">Курс</h3>
                            <ul style="text-align: left; color: var(--text-secondary); margin-bottom: 2rem; padding-left: 1.5rem;">
                                <li style="margin-bottom: 0.8rem;">5 интерактивных уроков</li>
                                <li style="margin-bottom: 0.8rem;">Теория и практика</li>
                                <li style="margin-bottom: 0.8rem;">Тестирование знаний</li>
                                <li style="margin-bottom: 0.8rem;">Сертификат по окончании</li>
                            </ul>
                            <button class="btn btn-primary" style="width: 100%;">Перейти к курсу</button>
                        </div>
                    </a>

                    <!-- Simulator Card -->
                    <a href="simulator.html" class="glass-card" style="text-decoration: none; display: block; transition: var(--transition);">
                        <div style="text-align: center;">
                            <div class="icon icon--simulator icon-large" style="margin: 0 auto 1.5rem;"></div>
                            <h3 style="font-size: 1.8rem; margin-bottom: 1.5rem; color: white;">Тренажёр</h3>
                            <ul style="text-align: left; color: var(--text-secondary); margin-bottom: 2rem; padding-left: 1.5rem;">
                                <li style="margin-bottom: 0.8rem;">12 реальных сценариев</li>
                                <li style="margin-bottom: 0.8rem;">Сбор требований</li>
                                <li style="margin-bottom: 0.8rem;">Документирование</li>
                                <li style="margin-bottom: 0.8rem;">Практика навыков аналитика</li>
                            </ul>
                            <button class="btn btn-primary" style="width: 100%;">Перейти к тренажёру</button>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Add hover effect for entire card
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px)';
                this.style.boxShadow = '0 20px 40px -20px rgba(0,0,0,0.5)';
            });

            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = '0 20px 40px -20px rgba(0,0,0,0.5)';
            });
        });
    </script>
</body>
</html>
