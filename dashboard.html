<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Системный анализ с нуля</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/icons.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>Системный анализ с нуля</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="dashboard.html" class="nav-link active">Курс</a>
                <a href="simulator.html" class="nav-link">Тренажёр</a>
                <a href="profile.html" class="nav-link">Профиль</a>
                <a href="#" class="nav-link" id="logoutLink">Выход</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section style="padding: 3rem 0;">
            <div class="container">
                <h2 class="section-title">Личный кабинет</h2>
                <div style="text-align: center; margin-bottom: 3rem; padding: 2rem; background: rgba(255, 255, 255, 0.03); border-radius: var(--radius); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08);">
                    <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Добро пожаловать, <span id="userName" style="color: var(--accent-blue); font-weight: 800;">Аналитик</span>!</p>
                    <p style="color: var(--text-secondary);">Продолжайте обучение, изучая материалы курса.</p>
                </div>

                <div style="margin-bottom: 2rem;">
                    <h3 class="section-title" style="font-size: 2rem;">Материалы курса</h3>
                </div>

                <div id="lessonsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem;">
                    <!-- Lessons will be loaded dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Курс "Системный анализ с нуля". Все права защищены.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Load lessons dynamically
        document.addEventListener('DOMContentLoaded', function() {
            loadLessons();
        });
    </script>
</body>
</html>
